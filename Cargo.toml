[package]
name = "simulate_load_rust"
version = "0.1.0"
edition = "2021"

[dependencies]
reqwest = { version = "0.12", features = ["default", "socks", "json", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "process", "io-std"] }
tokio-stream = { version = "0.1", features = ["time"] }
bytes = "1"
url = "2.5"
scraper = "0.22"
regex = "1"
rand = { version = "0.10", features = ["std_rng"] }

[[bin]]
name = "check_proxy"
path = "scratch/check_proxy.rs"
