[package]
name = "simulate_load_rust"
version = "0.1.0"
edition = "2021"

[dependencies]
reqwest = { version = "0.12", features = ["default", "socks", "json", "stream"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
url = "2.5.0"
futures = "0.3"
scraper = "0.22"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossterm = "0.29.0"
ratatui = "0.30.1"
eframe = "0.34.3"
egui = "0.34.3"
rand = "0.10.1"

