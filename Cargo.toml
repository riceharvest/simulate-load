[package]
name = "simulate_load_rust"
version = "0.1.0"
edition = "2021"

[dependencies]
libc = "0.2"
reqwest = { version = "0.12", features = ["default", "socks", "json", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "process", "io-std", "signal"] }
tokio-stream = { version = "0.1", features = ["time"] }
bytes = "1"
url = "2.5"
scraper = "0.22"
regex = "1"
rand = { version = "0.10", features = ["std_rng"] }
serde_json = "1"
base64 = "0.22"
flate2 = "1.0"
ratatui = "0.29"
crossterm = "0.28"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"